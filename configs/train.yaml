defaults:
  - data: doublewell
  - model: operator
  - experiment: em_1d
  - _self_

trainer:
  max_steps: 14000
  val_check_interval: 2000
  check_val_every_n_epoch: null
  accelerator: auto
  devices: 1
  logger: false
  enable_checkpointing: false
  num_sanity_val_steps: 0

seed: 0
train_dir: ./dump/nzf

# Which backend runs this config. torch (default) -> scripts/train.py in the .[torch] venv (Lightning loop).
# jax -> scripts/bridge.py (.[torch] venv, dumps <train_dir>/bridge.npz) then scripts/train_jax.py (.[jax] venv).
# The two backends pin conflicting CUDA runtimes, so each lives in its own venv; this field just records intent
# and lets each entrypoint fail fast if invoked under the wrong backend.
backend: torch

# JAX grid-search knobs (scripts/train_jax.py): checkpoint cadence + model-selection metric for best.eqx.
ckpt_every: 1000
monitor: recon_r2
monitor_mode: max
