_target_: opssm.models.filter_module.ZakaiFilterModule
data_size: 1
gru_hidden: 64
ctx_dim: 64
p: 64
encoder: gru              # context encoder: gru | tcn | transformer | mamba | deer_gru | rno (registry key,
                          #   opssm/models/encoders.py). gru = default, byte-identical. ALL must be CAUSAL
                          #   (ctx_t <- y_{0:t}); the backward smoother twin flips it generically.
encoder_kwargs: {}        # per-encoder overrides, e.g. {n_layers: 4, kernel: 2} / {n_heads: 4} / {n_modes: [1]}
drift_hidden: 64
lr: 2e-3
drift_lr: 2e-3
sched_gamma: 0.9998
n_scoll: 4
n_tcoll: 24
n_colloc: 128
chunk_size: 16
near_std: 0.3
broad_std: 1.6
warmup: 2000
m_every: 2000
m_inner: 400
reg_lambda: 3e-4
reg_lambda_g: 3e-3
g_init: 1.0
learn_dynamics: true
learn_g: true
g_net: false
learn_obs: false
pca_init: false          # HONEST default: learn the sensor direction C from a RANDOM init (the M-step
                         #   recovers |cos|->1 from scratch). pca_init=true seeds C at the data's top-PC
                         #   (~= the true sensor direction) -- a data-driven head start that trivially
                         #   pre-solves the sensor, so it's not an honest test of sensor learning.
c_stable_tol: 0.05
meshfree_mean: true       # M-step E[z|y]: true = deterministic mesh-free fixed-node IS (default; scales to
                          #   high-D latent, drift/sensor good, g mildly over-estimated); false = grid quadrature
n_mean: 256               # fixed-node sample count when meshfree_mean=true
res_mode: rel             # FP residual reduction: "rel" = scale-invariant (residual / local FP magnitude)
                          #   -- fixes over-dispersion by removing the sharp-density tail blow-up of the
                          #   absolute "l2" residual (which biases the operator WIDE); "log1p" = log-compress
w_res: 0.2                # weight on the FP residual vs the jump/ic recursion. The residual SPREADS and the
                          #   likelihood update SHARPENS, so w_res<1 sharpens the posterior toward the exact
                          #   filter's width (w_res=0 collapses to a spike). 0.2 = best filter match (1-D EM
                          #   KL 0.35->0.055, near-exact) with drift still fitting well IN-REGIME; g slightly
                          #   under. 0.4 = more conservative balance (KL 0.13, drift/g closest to rel). rel+w_res
                          #   tuned together; see notes/overdispersion.md.
learn_smoother: false     # two-filter backward-SPDE smoother: false = filter only (byte-identical to before);
                          #   true = also train the backward adjoint-Zakai operator (2nd E-step per iteration)
                          #   for p(z_t|y_{0:T}), enabling the smoother-mean drift + cross-cov g (see em_smooth).
joint_g: true             # estimate g from the FILTER lag-one joint (filter_pair_fixed) instead of the
                          #   filter-mean increment. The mean drops the increment VARIANCE so g under-reads
                          #   (~0.54 vs true 0.60 high-D); the joint's square-then-average residual recovers
                          #   E[(dz)^2|y] -- VALIDATED: g_aln 0.544 -> 0.605 high-D, drift/c_cos held. DRIFT
                          #   stays on the filter mean -> ONE posterior feeds both moments. forward-only (no
                          #   backward operator). false = the old (under-reading) filter-mean g.
loss: zakai
train_dir: ${train_dir}
