_target_: opssm.models.filter_module.ZakaiFilterModule
data_size: 1
gru_hidden: 64
ctx_dim: 64
p: 64
branch_hidden: 128        # branch MLP hidden width (context+time -> basis coeffs)
trunk_hidden: 64          # trunk MLP hidden width (latent z -> state basis)
trunk_layers: 3           # trunk MLP depth (# hidden layers)
trunk_activation: tanh   # tanh | softplus; changes only the state basis, not branch/encoder/dynamics
tail_std: 0.0             # 0 = no fixed tail; >0 adds -|z|²/(2 tail_std²) to the FORWARD
                         # density, guaranteeing integrability. Try 2.0; backward likelihood messages
                         # keep their original representation. Fixed scale, no extra learned parameters.
encoder: gru              # context encoder: gru | tcn | transformer | mamba | deer_gru | rno (registry key,
                          #   opssm/models/encoders.py). gru = default, byte-identical. ALL must be CAUSAL
                          #   (ctx_t <- y_{0:t}); the backward smoother twin flips it generically.
encoder_kwargs: {}        # per-encoder overrides, e.g. {n_layers: 4, kernel: 2} / {n_heads: 4} / {n_modes: [1]}
drift_hidden: 64
drift_layers: 3           # drift MLP depth (# hidden layers)
lr: 2e-3
drift_lr: 2e-3
sched_gamma: 0.9998
n_scoll: 4
n_tcoll: 24
n_colloc: 128
chunk_size: 16
near_std: 0.3
broad_std: 1.6
warmup: 0                # 0: the subspace init + bootstrap_mstep (below) replace the warmup -- the M-step
                         #   starts from a usable z_hat immediately. NB warmups below m_every are no-ops
                         #   (the first M-step lands at the same step regardless).
m_every: 2000
m_inner: 400
reg_lambda: 3e-4
reg_lambda_g: 3e-3
g_init: 1.0
learn_dynamics: true
learn_g: true
g_net: false
learn_obs: false
pca_init: false          # HONEST default: learn the sensor direction C from a RANDOM init (the M-step
                         #   recovers |cos|->1 from scratch). pca_init=true seeds C at the data's top-PC
                         #   (~= the true sensor direction) -- a data-driven head start that trivially
                         #   pre-solves the sensor, so it's not an honest test of sensor learning.
init_method: subspace    # obs-model init: null (fall back to pca_init) | random | pca | subspace.
                         #   'subspace' = temporal subspace-ID (also yields a dynamics matrix A). DEFAULT.
init_dynamics: true      # also warm-start the drift net from the init's linear dynamics A (pca: A fit on
                         #   PCA scores; subspace: A from the identification). false = drift stays zero-init.
bootstrap_mstep: true    # with warmup=0: run one init-time M-step from the deterministic init projection
                         #   (zhat_from_obs), so C/drift/g are fit from the init before any operator training.
c_stable_tol: 0.05
meshfree_mean: true       # M-step E[z|y]: true = deterministic mesh-free fixed-node IS (default; scales to
                          #   high-D latent, drift/sensor good, g mildly over-estimated); false = grid quadrature
n_mean: 256               # fixed-node sample count when meshfree_mean=true (also drives joint_g's pair sampler)
mean_method: mala         # filter-mean readout E[z|y] (used by the M-step's drift target + validation, NOT the
                          #   E-step): mala = gradient MCMC (Metropolis-adjusted Langevin), the robust DEFAULT.
                          #   fixed = deterministic fixed-node SNIS -- cheaper but at large g the broad proposal's
                          #   weights collapse onto a far outlier, dragging E[z|y] off the manifold (a "fly-off"
                          #   artifact that corrupts the drift regression -- see the vdp mean_method post-mortem).
                          #   The mala_* knobs apply only when mean_method=mala.
                          #   Because MALA samples the posterior directly, step size / burn-in / init are all
                          #   self-tuning (internal); only the compute budget + rng are exposed.
mala_chains: 64           # parallel MALA chains per (t,b) site (MALA moves samples -> far fewer than n_mean)
mala_steps: 30            # total MALA sweeps (burn-in = a third; step size auto-adapts to 0.574 acceptance)
mala_rng: stochastic      # stochastic = fresh RNG each M-step; crn = fixed-seed deterministic; qmc = deferred.
                          #   Phase-1 experiment: try stochastic FIRST (MALA self-corrects, may not diverge
                          #   like SNIS); fall back stochastic -> qmc -> crn only if g runs away.
anim_posterior: false     # d>1 only: also render an ANIMATED posterior p(z|y_{0:t}) over time to
                          #   <train_dir>/posterior_anim.mp4 each validation (VdP = 3-D surface, Lorenz = 3-D
                          #   scatter colored by p). ~3-7s/render; off by default (diagnostic).
plot_samples: false       # d==1: also save step_NNNNN_samples.pdf -- MALA posterior samples over time
                          #   (the per-time filter marginals' spread the mean-field M-step discards).
res_mode: rel             # FP residual reduction: "rel" = scale-invariant (residual / local FP magnitude)
                          #   -- fixes over-dispersion by removing the sharp-density tail blow-up of the
                          #   absolute "l2" residual (which biases the operator WIDE); "log1p" = log-compress
w_res: 0.2                # weight on the FP residual vs the jump/ic recursion. The residual SPREADS and the
                          #   likelihood update SHARPENS, so w_res<1 sharpens the posterior toward the exact
                          #   filter's width (w_res=0 collapses to a spike). 0.2 = best filter match (1-D EM
                          #   KL 0.35->0.055, near-exact) with drift still fitting well IN-REGIME; g slightly
                          #   under. 0.4 = more conservative balance (KL 0.13, drift/g closest to rel). rel+w_res
                          #   tuned together; see notes/overdispersion.md.
learn_smoother: false     # two-filter backward-SPDE smoother: false = filter only (byte-identical to before);
                          #   true = also train the backward adjoint-Zakai operator (2nd E-step per iteration)
                          #   for p(z_t|y_{0:T}), enabling the smoother-mean drift + cross-cov g (see em_smooth).
latent_dim: 1             # LATENT state dim d (SEPARATE from data_size = obs dim D). 1 = the double-well;
                          #   2 = Van der Pol, 3 = Lorenz. The trunk/drift/collocation are all (...,d);
                          #   d=1 is the special case gated to reproduce the em_1d/em_highd baselines.
joint_g: false            # g estimator. false = filter-MEAN increment (marginal); true = FILTER lag-one joint
                          #   (filter_pair_fixed SNIS, or filter_pair_mala when mean_method=mala). PHASE-2 FINDING:
                          #   g is DRIFT-LIMITED, not sampler-limited -- g_est^2 = g_true^2 + drift_rmse^2*dt, so
                          #   EVERY estimator lands at the same g (Lorenz marginal/SNIS/MALA-joint all g_rel~4; the
                          #   drift-residual term 131 dwarfs true g^2 9). The MARGINAL wins at d=2 (g_rel 1.2 vs the
                          #   joints' 1.6-1.9), ties at d=3, and is the simplest -> DEFAULT. The joint only helped
                          #   the d=1 baseline (g_aln 0.544->0.605, tiny drift error); at d>1 it just adds over-read.
                          #   To actually tighten g, fix the DRIFT (higher-order increment / finer dt), not the sampler.
drift_target: det_mid     # drift M-step increment target. DEFAULT det_mid (robust 2nd-order, see below).
                          #   forward = f(z_t) ~ (z_{t+1}-z_t)/dt (1st order, O(dt) bias -- legacy/reproduction).
                          #   ito = TARGET-side debias f(z_t) ~ (z_{t+1}-z_t)/dt - (dt/2) L f,
                          #   L f = (grad f)f + (g^2/2) Lap f (2nd order, noise-free input). WINS d=1/d=2 but the
                          #   O(|f|^2 dt) correction OVERTAKES f on stiff Lorenz (|f|~123, |L f|~3700) -> DIVERGES.
                          #   det_mid = INPUT-side: eval f at the RK2 predicted midpoint z_t + (dt/2) f(z_t) instead
                          #   (target unchanged). Also 2nd order + noise-free, but the shift is BOUNDED by (dt/2)|f|,
                          #   so it stays stable for stiff systems (oracle Lorenz 0.31). Both self-consistent (current
                          #   f,g), converge over the warm-started M-steps. Removes the coarse-dt drift bias.
                          #   A/B (dt=0.1, home benchmarks): drift_rel forward/ito/det_mid = dw 0.257/0.157/0.207,
                          #   vdp 0.254/0.211/0.185, lorenz 0.579/DIVERGES/0.211 (det_mid also moved the long-stuck
                          #   Lorenz g_rel 3.81->2.45). det_mid = robust winner (improves all 3, never diverges).
                          #   DEFERRED "clipped-ito": cap the ito correction at ~RMS|f| (GLOBAL scale, not per-point
                          #   |f| -- that zeros it at fixed points) -> ito's precision where the correction is small
                          #   + det_mid stability where it's large. Recovers the dw 0.207->0.157 gap, but adds a clip
                          #   hyperparameter, so not worth it unless the last bit of drift accuracy matters.
loss: zakai
train_dir: ${train_dir}
