_target_: opssm.models.filter_module.ZakaiFilterModule
data_size: 1
gru_hidden: 64
ctx_dim: 64
p: 64
drift_hidden: 64
lr: 2e-3
drift_lr: 2e-3
sched_gamma: 0.9998
n_scoll: 4
n_tcoll: 24
n_colloc: 128
chunk_size: 16
near_std: 0.3
broad_std: 1.6
warmup: 2000
m_every: 2000
m_inner: 400
reg_lambda: 3e-4
reg_lambda_g: 3e-3
g_init: 1.0
learn_dynamics: true
learn_g: true
g_net: false
learn_obs: false
pca_init: true
c_stable_tol: 0.05
meshfree_mean: true       # M-step E[z|y]: true = deterministic mesh-free fixed-node IS (default; scales to
                          #   high-D latent, drift/sensor good, g mildly over-estimated); false = grid quadrature
n_mean: 256               # fixed-node sample count when meshfree_mean=true
loss: zakai
train_dir: ${train_dir}
