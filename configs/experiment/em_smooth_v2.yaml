# @package _global_
# Stage 6: 1-D EM with the smoother FEEDING the M-step (v2 payoff). On top of em_smooth (learn_smoother),
# the drift regresses on the smoother-mean increments and g uses the lag-one cross-cov square-then-average
# estimator -- targeting the filter-mean g under-read (g should climb back toward the true 0.6). High-D:
#   experiment=em_highd model.learn_smoother=true model.smoother_mstep=true
defaults:
  - override /data: doublewell
model:
  learn_smoother: true
  smoother_mstep: true
