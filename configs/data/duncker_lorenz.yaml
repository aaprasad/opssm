_target_: opssm.data.doublewell.datamodule.DoubleWellDataModule
# Lorenz (10,28,8/3) in the Duncker/Li regime: sigma=0.15, N=20 sensor, TINY obs-noise std 0.01, x0 ~ N(0,I).
# DENSE obs + LONG trajectories (T=30 -> coverage 960).
system: lorenz
a: 1.0                 # unused for Lorenz
sigma: 0.15
noise_std: 0.01
num_steps: 300         # obs dt = 0.1
t0: 0.0
t1: 30.0
batch_size: 40         # 32 train + 8 val
n_val: 8
n_sub: 25              # inner dt = 0.004 (Lorenz-stable)
Nz: 200
zmax: 3.0
num_iters: ${trainer.max_steps}
highd: false
obs_dim: 20
c_scale: 1.0
init_std: 1.0
burn_in: 50            # sub-integrate onto the attractor before t=0
train_dir: ${train_dir}
